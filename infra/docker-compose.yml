version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: auto-investing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_investing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: auto-investing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:

