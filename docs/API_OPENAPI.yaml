openapi: 3.0.3
info:
  title: Auto Investing System Crypto API
  version: 0.1.0-mvp
  description: |
    MVP API specification for the subscription-based AI crypto auto-investing platform.
servers:
  - url: https://api.auto-investing.example.com
    description: Production
  - url: https://staging-api.auto-investing.example.com
    description: Staging
tags:
  - name: Auth
  - name: Billing
  - name: Exchange Accounts
  - name: Strategies
  - name: Orders
  - name: Portfolio
  - name: Reports
security:
  - bearerAuth: []
paths:
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: Register user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify MFA code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: MFA verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
  /v1/billing/checkout-session:
    post:
      tags: [Billing]
      summary: Create checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  $ref: '#/components/schemas/Plan'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url:
                    type: string
                    format: uri
                  session_id:
                    type: string
  /v1/billing/subscription:
    get:
      tags: [Billing]
      summary: Get current subscription
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
  /v1/exchange-accounts:
    get:
      tags: [Exchange Accounts]
      summary: List connected exchange accounts
      responses:
        '200':
          description: Exchange accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeAccount'
    post:
      tags: [Exchange Accounts]
      summary: Create and verify exchange account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeAccountCreateRequest'
      responses:
        '201':
          description: Exchange account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/exchange-accounts/{accountId}/verify:
    post:
      tags: [Exchange Accounts]
      summary: Re-verify exchange API credentials
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  reason:
                    type: string
                    nullable: true
  /v1/strategies:
    get:
      tags: [Strategies]
      summary: List strategies
      responses:
        '200':
          description: Strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Strategy'
    post:
      tags: [Strategies]
      summary: Create strategy config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreateRequest'
      responses:
        '201':
          description: Strategy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
  /v1/strategies/{strategyId}/activate:
    post:
      tags: [Strategies]
      summary: Activate strategy
      parameters:
        - $ref: '#/components/parameters/StrategyId'
      responses:
        '200':
          description: Strategy activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
  /v1/strategies/{strategyId}/pause:
    post:
      tags: [Strategies]
      summary: Pause strategy
      parameters:
        - $ref: '#/components/parameters/StrategyId'
      responses:
        '200':
          description: Strategy paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
  /v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - in: query
          name: strategy_id
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [Orders]
      summary: Submit order (manual or AI triggered)
      parameters:
        - in: header
          name: x-idempotency-key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Risk rule blocked order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/orders/simulate:
    post:
      tags: [Orders]
      summary: Simulate order impact in paper mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimated_slippage_bps:
                    type: number
                    format: float
                  estimated_fee:
                    type: number
                    format: float
                  risk_check_passed:
                    type: boolean
  /v1/portfolio/summary:
    get:
      tags: [Portfolio]
      summary: Portfolio summary for dashboard
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
  /v1/reports/daily:
    get:
      tags: [Reports]
      summary: Fetch daily performance report metadata
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
        format: uuid
    StrategyId:
      in: path
      name: strategyId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, role, mfa_enabled, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        mfa_enabled:
          type: boolean
        status:
          type: string
          enum: [active, suspended]
    Plan:
      type: string
      enum: [basic, pro, premium]
    Subscription:
      type: object
      required: [id, plan, status, current_period_start, current_period_end]
      properties:
        id:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
          enum: [trialing, active, past_due, canceled]
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
    ExchangeAccountCreateRequest:
      type: object
      required: [venue, api_key, api_secret]
      properties:
        venue:
          type: string
          example: binance
        api_key:
          type: string
        api_secret:
          type: string
        passphrase:
          type: string
          nullable: true
    ExchangeAccount:
      type: object
      required: [id, venue, status, last_verified_at]
      properties:
        id:
          type: string
          format: uuid
        venue:
          type: string
        status:
          type: string
          enum: [connected, verification_failed, disabled]
        last_verified_at:
          type: string
          format: date-time
    StrategyCreateRequest:
      type: object
      required: [exchange_account_id, profile, mode, risk_limits]
      properties:
        exchange_account_id:
          type: string
          format: uuid
        profile:
          type: string
          enum: [conservative, balanced, aggressive]
        mode:
          type: string
          enum: [paper, live]
        risk_limits:
          type: object
          properties:
            max_daily_loss_pct:
              type: number
              format: float
            max_position_pct:
              type: number
              format: float
            max_leverage:
              type: number
              format: float
    Strategy:
      type: object
      required: [id, profile, mode, status, risk_limits, created_at]
      properties:
        id:
          type: string
          format: uuid
        profile:
          type: string
          enum: [conservative, balanced, aggressive]
        mode:
          type: string
          enum: [paper, live]
        status:
          type: string
          enum: [draft, active, paused]
        risk_limits:
          type: object
        created_at:
          type: string
          format: date-time
    OrderCreateRequest:
      type: object
      required: [strategy_id, exchange_account_id, symbol, side, type, quantity]
      properties:
        strategy_id:
          type: string
          format: uuid
        exchange_account_id:
          type: string
          format: uuid
        symbol:
          type: string
          example: BTCUSDT
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [market, limit]
        quantity:
          type: number
          format: float
        limit_price:
          type: number
          format: float
          nullable: true
    OrderStatus:
      type: string
      enum: [pending, accepted, partially_filled, filled, canceled, rejected]
    Order:
      type: object
      required: [id, symbol, side, type, quantity, status, submitted_at]
      properties:
        id:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [market, limit]
        quantity:
          type: number
          format: float
        limit_price:
          type: number
          format: float
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        submitted_at:
          type: string
          format: date-time
    PortfolioSummary:
      type: object
      required:
        - total_equity
        - available_balance
        - unrealized_pnl
        - realized_pnl
        - daily_return_pct
        - max_drawdown_pct
        - sharpe_30d
      properties:
        total_equity:
          type: number
          format: float
        available_balance:
          type: number
          format: float
        unrealized_pnl:
          type: number
          format: float
        realized_pnl:
          type: number
          format: float
        daily_return_pct:
          type: number
          format: float
        max_drawdown_pct:
          type: number
          format: float
        sharpe_30d:
          type: number
          format: float
    DailyReport:
      type: object
      required: [date, net_pnl, return_pct, sharpe, max_drawdown, download_url]
      properties:
        date:
          type: string
          format: date
        net_pnl:
          type: number
          format: float
        return_pct:
          type: number
          format: float
        sharpe:
          type: number
          format: float
        max_drawdown:
          type: number
          format: float
        download_url:
          type: string
          format: uri
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
